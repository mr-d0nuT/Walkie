<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8202a">
<meta name="description" content="11N Vaga General · Walkie-talkie y chat en el navegador. Sin cuenta, sin registro, todo cifrado.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="11N Walkie">
<title>11N Vaga General · Walkie-Talkie</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('w.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{
  --bg:#f3f0ed;--card:#fff;--input:#f5f3f1;--line:#e5e0db;--line2:#cbc4bd;
  --fg:#2b2e33;--mut:#656a72;--red:#c8202a;--red2:#a5161f;--acc:#c8202a;--dark:#33373d;--green:#1a8f4d;
  --ptt1:#fff;--ptt2:#f1ece8;--shadow:#0000000d;
}
:root[data-theme=dark]{
  --bg:#0d0f12;--card:#171a1f;--input:#21252c;--line:#2b3038;--line2:#434a56;
  --fg:#eceef1;--mut:#a0a7b1;--acc:#ff6b76;--dark:#4a515c;--green:#38d17f;
  --ptt1:#292e36;--ptt2:#1b1f25;--shadow:#0006;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:Montserrat,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;min-height:100vh;
  padding:max(12px,env(safe-area-inset-top)) 12px calc(74px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
.app{max-width:980px;margin:0 auto}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 14px var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;flex:none;display:block;border-radius:10px}
.brandtxt{min-width:0;line-height:1.1}
.brandtxt b{display:block;font-weight:800;font-size:16px;white-space:nowrap}
.brandtxt b i{font-style:normal;color:var(--acc)}
.tag{font-size:10.5px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.topr{display:flex;gap:6px;flex:none}
.ib{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:700;cursor:pointer}
.netb{background:#f5a524;color:#1b1300;font-weight:700;font-size:13px;text-align:center;padding:9px 12px;border-radius:12px;margin-bottom:12px}
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.state{font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;background:var(--input)}
.state.on{color:var(--green);border-color:#1a8f4d55}
.state.tx{color:#fff;background:var(--red);border-color:var(--red)}
.state.rx{color:#fff;background:var(--dark);border-color:var(--dark)}
.count{font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.hero{display:block;width:min(52%,210px);height:auto;margin:0 auto 2px}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.alertslbl{margin:10px 0 6px}
.row{display:flex;gap:8px}
input[type=text]{width:100%;min-width:0;background:var(--input);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:17px;outline:none;color:var(--fg)}
.mono{letter-spacing:.06em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=text]:focus{border-color:var(--red)}
.cnt{font-size:12px;margin-top:6px;color:var(--mut)}
.cnt.ok{color:var(--green)}.cnt.bad{color:var(--acc)}
.mini{background:var(--input);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:42px}
.mini:hover{border-color:var(--line2)}
.mini.danger{color:var(--acc)}
.primary{width:100%;margin-top:18px;background:var(--red);color:#fff;border:0;border-radius:16px;padding:18px;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 4px 14px #c8202a40}
.primary:active{background:var(--red2)}
.primary:disabled{opacity:.55}
.hint{font-size:13px;line-height:1.55;color:var(--mut);margin-top:14px}
.chanbar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.chanbar .lbl{margin-top:0}
.chanwrap{min-width:0}
.chanval{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chanbtns{display:flex;gap:6px;flex:none}
.peers{display:flex;gap:6px;margin:10px 0 0;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.peers::-webkit-scrollbar{display:none}
.peer{flex:none;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--input);border:1px solid var(--line);display:flex;align-items:center;gap:7px}
.peer::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.peer.me{color:var(--mut)}
.peer.talk{background:var(--dark);border-color:var(--dark);color:#fff}
.peer.me.talk{background:var(--red);border-color:var(--red)}
.peer.talk::before{background:#fff;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.25}}
.empty{font-size:13px;color:var(--mut);padding:6px 0;white-space:nowrap}
.ptt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  width:min(66vw,calc(100vh - 480px),300px);width:min(66vw,calc(100dvh - 480px),300px);min-width:150px;aspect-ratio:1;margin:12px auto 12px;border-radius:50%;cursor:pointer;color:var(--acc);
  background:radial-gradient(circle at 50% 30%,var(--ptt1),var(--ptt2));border:5px solid var(--red);
  box-shadow:0 10px 26px #c8202a2e,inset 0 -6px 14px #0000000a;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .08s,box-shadow .15s}
.ptt.tx{color:#fff;background:radial-gradient(circle at 50% 30%,#e8424b,#b8141e);border-color:#b8141e;transform:scale(.96);
  box-shadow:0 0 0 12px #c8202a33,0 0 0 26px #c8202a1a,0 10px 30px #c8202a66}
.ptt.rx{color:var(--fg);border-color:var(--dark);box-shadow:0 0 0 12px #6b728033}
.ptt:disabled{opacity:.5}
.pttlbl{font-weight:800;letter-spacing:.05em;font-size:clamp(15px,4.6vw,19px);pointer-events:none;text-align:center;padding:0 14px;line-height:1.15}
.pttsub{font-size:12px;color:var(--mut);pointer-events:none;text-align:center;padding:0 20px}
.ptt.tx .pttsub{color:#ffe3e3}
.meter{height:7px;background:var(--input);border-radius:4px;overflow:hidden}
#meterFill{height:100%;width:0;background:var(--red);border-radius:4px;transition:width .08s linear}
.toggles{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px;font-size:13px;color:var(--mut)}
.tg{display:flex;align-items:center;gap:7px;cursor:pointer;min-height:32px}
.tg input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.tg.vol{flex:1;min-width:130px}
.tg.vol input{flex:1;accent-color:var(--red)}
.banner{margin-top:12px}
.banner button{width:100%;background:var(--dark);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;cursor:pointer}
.alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.al{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:74px;padding:8px 2px;border:0;border-radius:14px;color:#fff;font-weight:800;font-size:12px;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:transform .08s;line-height:1.15;text-align:center}
.al:active{transform:scale(.96)}
.al .ic{font-size:24px;line-height:1}
.al .tx{position:relative;z-index:1}
.al.pol{background:#1d4ed8}.al.alt{background:#15181d}.al.sos{background:#d90429}.al.loc{background:#1a8f4d}
:root[data-theme=dark] .al.alt{background:#000;box-shadow:inset 0 0 0 1.5px #555}
.al.arm::after{content:"";position:absolute;inset:0;background:#fff5;transform-origin:left;animation:fill var(--d,3s) linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.al.arm{outline:3px solid #f5b301;outline-offset:2px}
.al:disabled{opacity:.7}
.wipe{display:block;margin:16px auto 0;background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;cursor:pointer;padding:8px}
/* chat */
.side{display:flex;flex-direction:column}
.sidetitle{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sidetitle::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.log{display:flex;flex-direction:column;gap:6px;height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:200px;overflow-y:auto;font-size:15px;padding:2px 2px 6px;overscroll-behavior:contain}
.li{max-width:88%;align-self:flex-start;padding:8px 12px;background:var(--input);border-radius:4px 14px 14px 14px;line-height:1.35;overflow-wrap:anywhere}
.li .who{display:block;font-size:11px;font-weight:700;color:var(--acc);margin-bottom:1px}
.li .ts{font-size:10px;color:var(--mut);margin-left:8px;float:right;margin-top:4px;font-variant-numeric:tabular-nums}
.li.mine{align-self:flex-end;background:var(--red);color:#fff;border-radius:14px 4px 14px 14px}
.li.mine .ts{color:#ffd9d9}
.li.pend{opacity:.6}
.li.pend .ts::after{content:" ⏳"}
.li.voice{display:flex;align-items:center;gap:10px}
.li.voice .x{font-weight:600}
.li.voice button{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;font-size:13px;padding-left:2px}
.li.voice.mine button{background:#fff;color:var(--red)}
.li.sys{align-self:center;max-width:100%;background:none;color:var(--mut);font-size:12px;padding:2px 6px;text-align:center}
.li.sys.err{color:var(--acc);font-weight:700}
.li.alert{align-self:stretch;max-width:100%;color:#fff;border-radius:12px;font-weight:700}
.li.alert a{color:#fff;margin-left:6px}
.li.alert.pol{background:#1d4ed8}.li.alert.alt{background:#15181d}.li.alert.sos{background:#d90429}.li.alert.loc{background:#1a8f4d}
:root[data-theme=dark] .li.alert.alt{background:#000;box-shadow:inset 0 0 0 1.5px #555}
.li.alert.struck{opacity:.5;text-decoration:line-through}
.quick{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;background:var(--input);border:1.5px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chatform{display:flex;gap:8px;margin-top:6px}
.chatform input{padding:12px 16px;font-size:16px;border-radius:999px}
.chatform button{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:19px;cursor:pointer}
.chatform button:disabled,.chatform input:disabled,.quick button:disabled{opacity:.5}
.foot{font-size:11.5px;line-height:1.5;color:var(--mut);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
/* pestañas (móvil) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;padding:7px 12px calc(7px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--input);font-weight:800;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.tabs .badge{min-width:22px;height:22px;border-radius:11px;background:#f5b301;color:#111;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.app:not(.in) .tabs{display:none}
@media(max-width:839px){
  .app[data-tab=radio] #chat,.app[data-tab=chat] #radio,.app:not(.in) #chat{display:none}
}
@media(min-width:840px){
  body{padding-bottom:20px}
  .cols{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  .tabs{display:none!important}
  .log{height:min(58vh,520px)}
}
@media(max-height:700px) and (max-width:839px){.al{min-height:60px}.al .ic{font-size:21px}}
/* avisos emergentes: dejan pasar los toques */
.toasts{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 56px);right:8px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;width:min(310px,calc(100vw - 16px))}
.toast{pointer-events:none;width:100%;display:flex;gap:8px;align-items:center;padding:6px;border-radius:14px;color:#fff;opacity:.97;
  box-shadow:0 10px 28px #0006;border:2px solid #ffffff40;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-16px);opacity:0}}
.toast.pol{background:#1d4ed8}.toast.alt{background:#111}.toast.sos{background:#d90429}.toast.loc{background:#1a8f4d}
.toast.sos{animation:tin .25s ease-out,pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #d9042966,0 10px 28px #0006}}
.toast .map{pointer-events:auto;position:relative;display:block;width:60px;height:60px;border-radius:9px;overflow:hidden;flex:none;background:#d9dde2}
.toast .map img{position:absolute;width:256px;height:256px;max-width:none}
.toast .map i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#d90429;border:3px solid #fff;box-shadow:0 0 0 2px #0006}
.toast .nomap{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:#555;padding:4px;line-height:1.2}
.toast .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:11.5px;line-height:1.25}
.toast .tb b{font-size:13.5px;letter-spacing:.02em}
.toast .tb a,.toast .tb button.undo{pointer-events:auto;color:#fff;font-weight:700}
.toast .tb button.undo{align-self:flex-start;background:#ffffff33;border:0;border-radius:8px;padding:5px 10px;font-size:12px;margin-top:3px;cursor:pointer}
.toast .x{pointer-events:auto;align-self:flex-start;flex:none;width:32px;height:32px;border-radius:50%;border:0;background:#ffffff2e;color:#fff;font-size:18px;line-height:1;cursor:pointer}
/* hoja de invitación */
.sheet{position:fixed;inset:0;z-index:80;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.sheetbox{background:var(--card);border-radius:22px;padding:18px;width:min(360px,100%);max-height:100%;overflow:auto;text-align:center}
.sheetbox h2{font-size:17px;margin-bottom:4px}
.sheetbox p{font-size:13px;color:var(--mut);margin-bottom:12px}
.qr{background:#fff;border-radius:14px;padding:8px;margin:0 auto 12px;width:min(260px,100%)}
.qr svg{display:block;width:100%;height:auto}
.keybig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;font-size:19px;letter-spacing:.08em;color:var(--acc);margin-bottom:12px;overflow-wrap:anywhere}
.sheetbox .btns{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div id="app" class="app" data-tab="radio">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="11N" width="44" height="44">
      <div class="brandtxt"><b><i>VAGA</i> GENERAL</b><span class="tag">walkie-talkie</span></div>
    </div>
    <div class="topr">
      <button id="langBtn" class="ib" type="button" aria-label="Idioma / Llengua">CA</button>
      <button id="themeBtn" class="ib" type="button" aria-label="Tema">🌙</button>
    </div>
  </header>
  <div id="netBanner" class="netb" hidden data-i="offline_banner"></div>

  <main class="cols">
    <section id="radio" class="pane card">
      <div id="joinPanel">
        <img class="hero" src="logo.png" alt="11N Vaga General · Walkie-Talkie" width="640" height="640">
        <label class="lbl" for="chan" data-i="chan_lbl"></label>
        <div class="row">
          <input type="text" class="mono" id="chan" maxlength="20" spellcheck="false" autocomplete="off" autocapitalize="characters" data-pl="chan_ph">
          <button id="newChan" class="mini" type="button" data-ti="newkey">↻</button>
        </div>
        <div id="chanCount" class="cnt"></div>
        <label class="lbl" for="nick" data-i="nick_lbl"></label>
        <input type="text" id="nick" maxlength="14" spellcheck="false" autocomplete="off" data-pl="nick_ph">
        <button id="joinBtn" class="primary" type="button" data-i="join"></button>
        <p class="hint" data-i="hint"></p>
      </div>

      <div id="radioPanel" hidden>
        <div class="chanbar">
          <div class="chanwrap">
            <div class="lbl" data-i="key_lbl"></div>
            <div id="chanName" class="chanval">—</div>
          </div>
          <div class="chanbtns">
            <button id="copyBtn" class="mini" type="button" data-i="invite"></button>
            <button id="leaveBtn" class="mini danger" type="button" data-i="leave"></button>
          </div>
        </div>
        <div class="statusrow"><div id="state" class="state"></div><div id="count" class="count"></div></div>
        <div id="peers" class="peers"></div>

        <button id="ptt" class="ptt" type="button">
          <span id="pttLbl" class="pttlbl"></span>
          <span id="pttSub" class="pttsub"></span>
        </button>
        <div class="meter"><div id="meterFill"></div></div>

        <div class="lbl alertslbl" data-i="alerts_lbl"></div>
        <div class="alerts">
          <button class="al pol" type="button" data-k="pol"><span class="ic">👮</span><span class="tx"></span></button>
          <button class="al alt" type="button" data-k="alt"><span class="ic">⚠️</span><span class="tx"></span></button>
          <button class="al sos" type="button" data-k="sos"><span class="ic">🆘</span><span class="tx"></span></button>
          <button class="al loc" type="button" data-k="loc"><span class="ic">📍</span><span class="tx"></span></button>
        </div>
        <div class="toggles">
          <label class="tg"><input type="checkbox" id="tapTgl"> <span data-i="tap_mode"></span></label>
          <label class="tg"><input type="checkbox" id="beepTgl" checked> <span data-i="beeps"></span></label>
          <button id="replayBtn" class="mini" type="button" data-i="replay"></button>
          <label class="tg vol"><span data-i="vol"></span><input type="range" id="vol" min="0" max="1.5" step="0.05" value="1"></label>
        </div>

        <button id="wipeBtn" class="wipe" type="button" data-i="wipe"></button>
      </div>
      <div id="audioBanner" class="banner" hidden><button id="audioBtn" type="button" data-i="audio_on"></button></div>
    </section>

    <section id="chat" class="pane card side">
      <div class="sidetitle" data-i="chat_title"></div>
      <div id="log" class="log"></div>
      <div id="quick" class="quick"></div>
      <form id="chatForm" class="chatform" autocomplete="off">
        <input type="text" id="chatIn" maxlength="500" data-pl="chat_ph" enterkeyhint="send" disabled>
        <button id="chatSend" type="submit" aria-label="Enviar" disabled>➤</button>
      </form>
      <div class="foot" data-i="foot"></div>
    </section>
  </main>

  <nav id="tabs" class="tabs">
    <button type="button" data-tab="radio" class="on">🎙 <span data-i="tab_radio"></span></button>
    <button type="button" data-tab="chat">💬 <span data-i="tab_chat"></span><b id="badge" class="badge" hidden>0</b></button>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="assertive"></div>

<div id="inviteSheet" class="sheet" hidden>
  <div class="sheetbox" role="dialog" aria-modal="true">
    <h2 data-i="inv_title"></h2>
    <p data-i="inv_scan"></p>
    <div id="qrBox" class="qr"></div>
    <div id="invKey" class="keybig"></div>
    <div class="btns">
      <button id="invShare" class="primary" type="button" style="margin-top:0" data-i="inv_share"></button>
      <button id="invCopy" class="mini" type="button" data-i="inv_copy"></button>
      <button id="invClose" class="mini" type="button" data-i="close"></button>
    </div>
  </div>
</div>

<script src="qr.js"></script>
<script>

/* ---------- ADPCM IMA (4 bits/muestra) ---------- */
const STEP = [7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];
const IDX = [-1,-1,-1,-1,2,4,6,8];
function adpcmEnc(pcm, st) {
  const out = new Uint8Array(pcm.length >> 1);
  let p = st.p, ix = st.i;
  for (let n = 0; n < pcm.length; n++) {
    let step = STEP[ix], diff = pcm[n] - p, code = 0;
    if (diff < 0) { code = 8; diff = -diff; }
    let vp = step >> 3;
    if (diff >= step) { code |= 4; diff -= step; vp += step; }
    step >>= 1; if (diff >= step) { code |= 2; diff -= step; vp += step; }
    step >>= 1; if (diff >= step) { code |= 1; vp += step; }
    p += (code & 8) ? -vp : vp;
    if (p > 32767) p = 32767; else if (p < -32768) p = -32768;
    ix += IDX[code & 7]; if (ix < 0) ix = 0; else if (ix > 88) ix = 88;
    if (n & 1) out[n >> 1] |= code << 4; else out[n >> 1] = code;
  }
  st.p = p; st.i = ix;
  return out;
}
function adpcmDec(data, p, ix) {
  const out = new Int16Array(data.length * 2);
  for (let n = 0; n < out.length; n++) {
    const code = (n & 1) ? data[n >> 1] >> 4 : data[n >> 1] & 15;
    const step = STEP[ix];
    let vp = step >> 3;
    if (code & 4) vp += step;
    if (code & 2) vp += step >> 1;
    if (code & 1) vp += step >> 2;
    p += (code & 8) ? -vp : vp;
    if (p > 32767) p = 32767; else if (p < -32768) p = -32768;
    ix += IDX[code & 7]; if (ix < 0) ix = 0; else if (ix > 88) ix = 88;
    out[n] = p;
  }
  return out;
}

/* ---------- cliente MQTT 3.1.1 mínimo sobre WebSocket ---------- */
function mqttStr(s) { const b = te.encode(s); return cat([[b.length >> 8, b.length & 255], b]); }
function mqttPkt(type, body) {
  const len = []; let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; len.push(d); } while (n);
  return cat([[type], len, body]);
}
function Mqtt(url, topic, will, onmsg, onstate) {
  let ws, buf = new Uint8Array(0), ping, retry, closed = false, up = false, lastRx = 0, fails = 0;
  const setUp = v => { if (up !== v) { up = v; onstate(v); } };
  function open() {
    clearTimeout(retry);
    try { ws = new WebSocket(url, 'mqtt'); } catch { retry = setTimeout(open, 5000); return; }
    ws.binaryType = 'arraybuffer';
    buf = new Uint8Array(0); lastRx = Date.now();
    ws.onopen = () => {
      const cid = 'w' + hex(crypto.getRandomValues(new Uint8Array(8)));
      const parts = [mqttStr('MQTT'), [4, 0x02 | (will ? 0x04 : 0)], [0, 30], mqttStr(cid)];
      if (will) parts.push(mqttStr(topic), [will.length >> 8, will.length & 255], will);
      ws.send(mqttPkt(0x10, cat(parts)));
    };
    ws.onmessage = e => { lastRx = Date.now(); buf = cat([buf, new Uint8Array(e.data)]); parse(); };
    ws.onerror = () => {};
    ws.onclose = () => {
      setUp(false); clearInterval(ping);
      if (!closed) { fails++; retry = setTimeout(open, Math.min(2000 * fails, 10000)); }
    };
  }
  function parse() {
    for (;;) {
      if (buf.length < 2) return;
      let i = 1, mul = 1, len = 0, d;
      do { if (i >= buf.length) return; d = buf[i++]; len += (d & 127) * mul; mul *= 128; } while (d & 128);
      if (buf.length < i + len) return;
      const h = buf[0], body = buf.slice(i, i + len);
      buf = buf.slice(i + len);
      const type = h >> 4;
      if (type === 2) {                                   // CONNACK
        if (body[1] !== 0) { ws.close(); return; }
        ws.send(mqttPkt(0x82, cat([[0, 1], mqttStr(topic), [0]])));
        clearInterval(ping);
        ping = setInterval(() => {
          if (ws.readyState !== 1) return;
          if (Date.now() - lastRx > 50000) { try { ws.close(); } catch {} return; }   // conexión muerta
          ws.send(new Uint8Array([0xC0, 0]));
        }, 20000);
      } else if (type === 9) {                            // SUBACK
        fails = 0; setUp(true);
      } else if (type === 3) {                            // PUBLISH
        let off = 2 + ((body[0] << 8) | body[1]);
        if ((h >> 1) & 3) off += 2;
        onmsg(body.subarray(off));
      }
    }
  }
  open();
  return {
    get up() { return up; },
    publish(payload) {
      if (up && ws.readyState === 1 && ws.bufferedAmount < 300000)
        ws.send(mqttPkt(0x30, cat([mqttStr(topic), payload])));
    },
    kick() { if (!closed && !up && (!ws || ws.readyState > 1)) { fails = 0; open(); } },
    close() {
      closed = true; clearTimeout(retry); clearInterval(ping);
      try { if (ws.readyState === 1) ws.send(new Uint8Array([0xE0, 0])); ws.close(); } catch {}
      setUp(false);
    }
  };
}

async function deriveKeys(chan) {
  const base = await crypto.subtle.importKey('raw', te.encode(chan), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: te.encode('onda-walkie-v1'), iterations: 150000 }, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
  return { key, topic: 'onda1/' + hex(bits.slice(32, 48)) };
}
async function seal(plain) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, S.key, plain));
  return cat([iv, ct]);
}

const WORKLET = `
class Cap extends AudioWorkletProcessor{
  constructor(){super();this.on=false;this.buf=new Int16Array(${FRAME});this.n=0;this.acc=0;this.cnt=0;this.pos=0;
    this.ratio=sampleRate/${RATE};this.pk=0;this.pc=0;
    this.port.onmessage=e=>{
      if(e.data.on){this.on=true;this.n=0;this.acc=0;this.cnt=0;this.pos=0;}
      else if(this.on){this.on=false;if(this.n){this.buf.fill(0,this.n);this.flush();}this.port.postMessage({end:1});}
    };}
  flush(){const b=this.buf.slice();this.port.postMessage({pcm:b},[b.buffer]);this.n=0;}
  process(inputs){
    const ch=inputs[0]&&inputs[0][0];if(!ch)return true;
    for(let i=0;i<ch.length;i++){
      const s=ch[i],a=s<0?-s:s;if(a>this.pk)this.pk=a;
      if(this.on){this.acc+=s;this.cnt++;this.pos++;
        if(this.pos>=this.ratio){this.pos-=this.ratio;let v=this.acc/this.cnt;this.acc=0;this.cnt=0;
          v=v>1?1:v<-1?-1:v;this.buf[this.n++]=v*32767;if(this.n===${FRAME})this.flush();}}
    }
    this.pc+=ch.length;if(this.pc>=sampleRate/15){this.port.postMessage({lvl:this.pk});this.pk=0;this.pc=0;}
    return true;}
}

function upsample(pcm, prev) {            // 16 kHz -> frecuencia del contexto, interpolación lineal
  const ratio = S.ctx.sampleRate / RATE;
  const n = Math.round(pcm.length * ratio);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i + 1) / ratio - 1, j = Math.floor(x), f = x - j;
    const a = j < 0 ? prev : pcm[j], b = j + 1 < pcm.length ? pcm[j + 1] : pcm[pcm.length - 1];
    out[i] = (a + (b - a) * f) / 32768;
  }
  return out;
}
function playAt(pcm, when, prev) {
  const f = upsample(pcm, prev || 0);
  const buf = S.ctx.createBuffer(1, f.length, S.ctx.sampleRate);
  buf.getChannelData(0).set(f);
  const src = S.ctx.createBufferSource();
  src.buffer = buf; src.connect(S.master); src.start(when);
}
function playPcm(pcm) {
  if (!S.ctx || !pcm) return;
  S.ctx.resume();
  playAt(pcm, S.ctx.currentTime + 0.05, 0);
}
function beep(freqs, when, vol = 0.18) {
  if (!S.ctx || !$('beepTgl').checked) return;
  let t0 = Math.max(when || 0, S.ctx.currentTime);
  for (const f of freqs) {
    const o = S.ctx.createOscillator(), g = S.ctx.createGain();

  const c = $('chanCount');
  c.textContent = L('chan_cnt', v.length);
  c.className = 'cnt ' + (v.length >= 10 ? 'ok' : v.length ? 'bad' : '');
}
const inviteUrl = () => location.origin + location.pathname + location.search + '#' + S.chan;
function openInvite() {
  const url = inviteUrl();
  $('invKey').textContent = S.chan;
  const box = $('qrBox'); box.textContent = ''; box.hidden = false;
  try {
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    box.innerHTML = q.createSvgTag({ cellSize: 6, margin: 1, scalable: true });
  } catch { box.hidden = true; }
  $('inviteSheet').hidden = false;
}
async function copyInvite() {
  const url = inviteUrl();
  try { await navigator.clipboard.writeText(url); log(L('inv_copied'), {}); }
  catch { window.prompt('', url); }
}
async function shareInvite() {
  const url = inviteUrl();
  try {
    if (navigator.share) await navigator.share({ title: '11N Vaga General · Walkie-Talkie', url });
    else await copyInvite();
  } catch (e) { if (!e || e.name !== 'AbortError') copyInvite(); }
}

async function join() {
  const chan = cleanKey($('chan').value);
  if (chan.length < 10) { updCount(); $('chan').focus(); return; }
  if (!window.crypto || !crypto.subtle) { log(L('err_https'), { cls: 'err' }); return; }
  const btn = $('joinBtn'); btn.disabled = true; btn.textContent = L('joining');
  try {
    S.nick = ($('nick').value.trim().toUpperCase().slice(0, 14)) || '11N-' + (100 + Math.floor(Math.random() * 900));
    $('nick').value = S.nick;
    store.set('w.nick', S.nick); store.set('w.chan', chan);
    await initAudio();
    if (!S.cap) await initMic(); else S.micOk = true;
    getPos(60000, 10000);                       // pide el permiso de ubicación ahora, con calma, no en plena emergencia
    const k = await deriveKeys(chan);
    S.key = k.key; S.topic = k.topic; S.chan = chan;
    S.id = crypto.getRandomValues(new Uint8Array(4)); S.idHex = hex(S.id);
    S.txId = crypto.getRandomValues(new Uint8Array(1))[0];
    S.peers.clear(); S.outbox = []; S.joined = true;
    const will = await seal(ctlBytes({ t: 'bye', id: S.idHex, nick: S.nick }));
    S.clients = BROKERS.map(u => Mqtt(u, S.topic, will, onMsg, upNow => {
      if (upNow && S.joined) { publish(ctlBytes({ t: 'hello', id: S.idHex, nick: S.nick })); flushOutbox(); }
      render();
    }));
    S.timers = [setInterval(sweep, 2500)];
    schedPresence();
    $('chanName').textContent = chan;
    $('joinPanel').hidden = true; $('radioPanel').hidden = false;
    $('app').classList.add('in'); setTab('radio');
    $('log').textContent = '';
    try { history.replaceState(null, '', '#' + chan); } catch {}
    log(L('in_chan', chan, S.nick), {});
    $('chatIn').disabled = false; $('chatSend').disabled = false;
    qsa('#quick button').forEach(b => { b.disabled = false; });
    wakeLock(); checkAudio(); render();
  } catch (e) {
    log(L('err_join', e.message || e), { cls: 'err' });
    S.joined = false;
  }
  btn.disabled = false; btn.textContent = L('join');
}
async function leave() {
  if (!S.joined) return;
  cancelPending(); stopTx();
  try { await publish(ctlBytes({ t: 'bye', id: S.idHex, nick: S.nick })); } catch {}
  S.joined = false;
  S.timers.forEach(clearInterval); S.timers = []; clearTimeout(S.presT);
  const cl = S.clients; S.clients = [];
  setTimeout(() => cl.forEach(c => c.close()), 150);
  for (const p of S.peers.values()) clearTimeout(p.tmo);
  S.peers.clear(); S.outbox = [];
  if (S.wake) { try { S.wake.release(); } catch {} S.wake = null; }
  micEnable(false);
  $('radioPanel').hidden = true; $('joinPanel').hidden = false; $('audioBanner').hidden = true;
  $('app').classList.remove('in'); setTab('radio');
  $('chatIn').disabled = true; $('chatSend').disabled = true;
  qsa('#quick button').forEach(b => { b.disabled = true; });
  qsa('.toast').forEach(e => e.remove());
  S.unread = 0; showUnread();
  meter(0); render();
  log(L('left_chan'), {});
}
async function wipe() {
  await leave();
  store.del('w.chan'); store.del('w.nick');
  $('chan').value = ''; $('nick').value = ''; updCount();
  $('log').textContent = '';
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  log(L('wiped'), {});
}
async function wakeLock() {
  try { if (navigator.wakeLock && S.joined && document.visibilityState === 'visible') S.wake = await navigator.wakeLock.request('screen'); } catch {}
}
function setTheme(th) {
  document.documentElement.dataset.theme = th;
  store.set('w.theme', th);
  $('themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = th === 'dark' ? '#0d0f12' : '#c8202a';
}

/* ---------- eventos ---------- */
$('chan').addEventListener('input', updCount);
$('newChan').onclick = () => { $('chan').value = randomKey(16); updCount(); };
$('joinBtn').onclick = join;
$('nick').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
$('chan').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
$('leaveBtn').onclick = leave;
$('wipeBtn').onclick = wipe;
$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('chatIn'); sendChatText(inp.value); inp.value = '';
});
$('copyBtn').onclick = openInvite;
$('invClose').onclick = () => { $('inviteSheet').hidden = true; };
$('inviteSheet').addEventListener('click', e => { if (e.target === $('inviteSheet')) $('inviteSheet').hidden = true; });
$('invShare').onclick = shareInvite;
$('invCopy').onclick = copyInvite;
$('langBtn').onclick = () => { lang = lang === 'es' ? 'ca' : 'es'; store.set('w.lang', lang); applyLang(); };
$('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('replayBtn').onclick = () => playPcm(S.lastPcm);
$('vol').oninput = e => { if (S.master) S.master.gain.value = +e.target.value; store.set('w.vol', e.target.value); };
$('beepTgl').onchange = e => store.set('w.beep', e.target.checked ? '1' : '0');
$('tapTgl').onchange = e => { stopTx(); store.set('w.tap', e.target.checked ? '1' : '0'); render(); };
$('audioBtn').onclick = () => S.ctx && S.ctx.resume().then(checkAudio);
qsa('.al').forEach(b => { b.onclick = () => alertBtn(b); });
qsa('#tabs button').forEach(b => { b.onclick = () => setTab(b.dataset.tab); });

const ptt = $('ptt');
ptt.addEventListener('pointerdown', e => {
  e.preventDefault();
  if ($('tapTgl').checked) { S.tx ? stopTx() : startTx(); return; }
  try { ptt.setPointerCapture(e.pointerId); } catch {}
  startTx();
});
const release = () => { if (!$('tapTgl').checked) stopTx(); };
ptt.addEventListener('pointerup', release);
ptt.addEventListener('pointercancel', release);
ptt.addEventListener('lostpointercapture', release);
ptt.addEventListener('contextmenu', e => e.preventDefault());
ptt.addEventListener('click', e => e.preventDefault());

const typing = e => (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'range') || (e.target.tagName === 'BUTTON' && e.target.id !== 'ptt');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('inviteSheet').hidden = true;
  if (e.code !== 'Space' || !S.joined || typing(e)) return;
  e.preventDefault();
  if (e.repeat) return;
  if ($('tapTgl').checked) S.tx ? stopTx() : startTx(); else startTx();
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space' || !S.joined || typing(e)) return;
  e.preventDefault(); release();
});
window.addEventListener('blur', release);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopTx(); return; }
  if (S.joined) { wakeLock(); sendHere(); S.clients.forEach(c => c.kick()); if (S.ctx) S.ctx.resume(); }
  if (chatVisible()) { S.unread = 0; showUnread(); }
});
window.addEventListener('online', () => { if (S.joined) S.clients.forEach(c => c.kick()); });
window.addEventListener('pagehide', e => {
  if (S.joined && !e.persisted) S.clients.forEach(c => c.close());   // los demás reciben el «bye» del testamento MQTT
});
matchMedia('(min-width:840px)').addEventListener('change', () => { if (chatVisible()) { S.unread = 0; showUnread(); } render(); });

/* ---------- arranque ---------- */
let hashKey = '';
try { hashKey = cleanKey(decodeURIComponent(location.hash.slice(1))); } catch {}
$('chan').value = hashKey || store.get('w.chan') || randomKey(16);
$('nick').value = store.get('w.nick') || '';
$('vol').value = store.get('w.vol') || '1';
$('beepTgl').checked = store.get('w.beep') !== '0';
$('tapTgl').checked = store.get('w.tap') === '1';
setTheme(document.documentElement.dataset.theme || 'light');
applyLang();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__w = S;
})();
</script>
</body>
</html>
